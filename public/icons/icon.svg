<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="128" height="128" rx="24" ry="24" fill="#0f172a"/>

  <!-- Gradient accent blob -->
  <rect x="8" y="8" width="112" height="112" rx="20" ry="20" fill="url(#bg)" opacity="0.18"/>

  <!-- Document body -->
  <rect x="30" y="38" width="58" height="70" rx="6" ry="6" fill="#1e293b" stroke="#6366f1" stroke-width="2.5"/>

  <!-- Dog-ear on document -->
  <polygon points="74,38 88,38 88,52" fill="#6366f1" opacity="0.7"/>
  <polyline points="74,38 74,52 88,52" fill="none" stroke="#6366f1" stroke-width="1.5"/>

  <!-- Document lines -->
  <line x1="40" y1="66" x2="78" y2="66" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <line x1="40" y1="78" x2="78" y2="78" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="40" y1="90" x2="62" y2="90" stroke="#6366f1" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- Paper airplane -->
  <g transform="translate(52, 18) rotate(35)">
    <!-- Main body -->
    <polygon points="0,0 32,12 0,24" fill="url(#plane)" opacity="0.97"/>
    <!-- Inner fold -->
    <polygon points="0,14 32,12 16,20" fill="#c7d2fe" opacity="0.6"/>
    <!-- Wing line -->
    <line x1="0" y1="12" x2="32" y2="12" stroke="#a5b4fc" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Gradient border glow -->
  <rect x="4" y="4" width="120" height="120" rx="22" ry="22" fill="none" stroke="url(#bg)" stroke-width="1.5" opacity="0.5"/>
</svg>
